<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitPlan">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>FitPlan</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#f5f5f7;background:#0b0b0d;--muted:#a1a1a8;--card:#17171a;--line:#29292e;--red:#ff554a}
*{box-sizing:border-box}body{margin:0;background:#0b0b0d}button,input{font:inherit}button{color:#fff;background:#17171a;border:1px solid var(--line);border-radius:14px;min-height:46px;padding:10px 14px;font-weight:650}button.active,.primary{background:#ff554a1f;border-color:#ff554a;color:#fff}.wrap{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:28px;font-weight:800}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0 14px}.tabs button{white-space:nowrap}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}.hero{background:#f0f0ed;border-radius:20px;overflow:hidden;margin:14px 0}.hero svg{display:block;width:100%;height:340px}.skin{fill:#d8d7d2;stroke:#555;stroke-width:2}.muscle{fill:#ff554a;stroke:#a82e29;stroke-width:1.4}.outline{fill:none;stroke:#666;stroke-width:3;stroke-linecap:round}.weight{fill:#222}.arrow{fill:none;stroke:#ff554a;stroke-width:5;stroke-linecap:round;stroke-dasharray:12 9;animation:dash 1.1s linear infinite}@keyframes dash{to{stroke-dashoffset:-42}}.pulse{animation:pulse 1.5s ease-in-out infinite alternate}@keyframes pulse{from{opacity:.72}to{opacity:1}}.set{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}.set:first-child{border-top:0}.check{width:40px;height:40px;min-height:40px;padding:0;border-radius:50%}.done{background:#ff554a1f;border-color:#ff554a;color:#ff554a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:12px;border:1px solid var(--line);border-radius:14px}.metric input{width:70px;max-width:100%;background:transparent;border:1px solid var(--line);border-radius:9px;color:#fff;padding:7px;text-align:center}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.small{font-size:13px}.big{font-size:21px;font-weight:800}.sp{height:10px}.progress{height:7px;background:#29292e;border-radius:99px;overflow:hidden}.bar{height:100%;background:#ff554a;border-radius:99px;width:0}.list{display:grid;gap:10px}.exercise-item{padding:14px;border:1px solid var(--line);border-radius:16px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="title">💪 FitPlan</div><div class="muted">Domowy plan redukcyjny</div></div><div style="text-align:right"><div id="pct" class="big">0%</div><div class="muted small">postęp</div></div></div>
<div class="tabs"><button class="active" data-tab="A">Trening A</button><button data-tab="B">Trening B</button><button data-tab="plan">Plan 8 tyg.</button></div>
<div id="app"></div>
<div class="footer">FitPlan • 181 cm • 87 kg • 2–3 treningi/tydz.</div>
</div>
<script>
const W={
A:[
['Przysiad z hantlami',3,'8–12','Nogi','squat','Czworogłowe • Pośladki'],
['Wyciskanie hantli na ławce',3,'8–12','Klatka','bench','Klatka • Triceps • Przedni bark'],
['Wiosłowanie hantlem',3,'8–12 / str.','Plecy','row','Plecy • Biceps'],
['Rumuński martwy ciąg',3,'8–12','Tył uda','rdl','Dwugłowe uda • Pośladki'],
['Wyciskanie hantli nad głowę',3,'8–12','Barki','ohp','Barki • Triceps'],
['Uginanie hantli na biceps',2,'10–15','Biceps','curl','Biceps • Przedramię'],
['Prostowanie hantla na triceps',2,'10–15','Triceps','tri','Triceps'],
['Spięcia brzucha',2,'12–20','Brzuch','abs','Prosty brzucha']
],
B:[
['Bułgarskie przysiady',3,'8–12 / noga','Nogi','squat','Czworogłowe • Pośladki'],
['Wyciskanie hantli — skos',3,'8–12','Klatka','bench','Górna klatka • Triceps'],
['Wiosłowanie hantlami',3,'8–12','Plecy','row','Plecy • Biceps'],
['Hip thrust z hantlem',3,'10–15','Pośladki','hip','Pośladki • Dwugłowe uda'],
['Unoszenie hantli bokiem',3,'12–20','Barki','lat','Boczny bark'],
['Uginanie młotkowe',2,'10–15','Biceps','curl','Brachialis • Biceps'],
['Francuskie wyciskanie',2,'10–15','Triceps','tri','Triceps'],
['Plank',2,'30–60 s','Brzuch','plank','Core']
]};
let tab='A',idx=0,sec=90,timer=null;
let state=JSON.parse(localStorage.getItem('fitplan')||'{}');
state.done=state.done||{};state.weight=state.weight||{};state.sessions=state.sessions||[];
const app=document.getElementById('app');

function fig(type){
let b='';
if(type==='squat') b='<circle cx="210" cy="45" r="24" class="skin"/><path d="M180 72Q210 60 240 72L252 145Q210 165 168 145Z" class="skin"/><path d="M192 140L176 195L166 275L203 275L210 195L217 275L254 275L244 195L228 140Z" class="muscle pulse"/><path d="M180 76L145 120L132 170M240 76L275 120L288 170" class="outline"/><path d="M120 90Q95 135 125 185M300 90Q325 135 295 185" class="arrow"/>';
else if(type==='bench') b='<path d="M60 225H360" stroke="#777" stroke-width="5"/><path d="M120 205L235 165L290 205" stroke="#777" stroke-width="14" fill="none"/><circle cx="235" cy="130" r="22" class="skin"/><path d="M210 145L170 180L235 190L285 165" class="skin"/><path d="M170 180L135 145M285 165L315 125" class="outline"/><path d="M135 145L115 115M315 125L335 95" class="outline"/><circle cx="115" cy="115" r="11" class="weight"/><circle cx="335" cy="95" r="11" class="weight"/><path d="M135 145Q110 120 115 85M315 125Q340 100 335 65" class="arrow"/><path d="M190 154L215 166L250 160L270 148" class="muscle pulse"/>';
else if(type==='row') b='<circle cx="190" cy="58" r="22" class="skin"/><path d="M165 82L140 130L95 175L120 190L175 150L225 150L280 110" class="skin"/><path d="M175 150L150 230M225 150L260 230" class="outline"/><circle cx="95" cy="175" r="11" class="weight"/><circle cx="315" cy="80" r="11" class="weight"/><path d="M100 170Q140 120 185 110M315 85Q270 110 230 125" class="arrow"/><path d="M155 92L210 105L250 95L270 110L225 145L175 145Z" class="muscle pulse"/>';
else if(type==='rdl') b='<circle cx="180" cy="55" r="22" class="skin"/><path d="M165 78L145 125L120 175L90 245M145 125L205 155L250 235" class="skin"/><path d="M120 175L90 245M205 155L250 235" class="outline"/><circle cx="108" cy="160" r="11" class="weight"/><circle cx="245" cy="180" r="11" class="weight"/><path d="M95 95Q70 150 105 195M260 95Q285 150 250 195" class="arrow"/><path d="M120 130L175 150L210 145L230 165L200 185L145 170Z" class="muscle pulse"/>';
else if(type==='ohp') b='<circle cx="210" cy="48" r="23" class="skin"/><path d="M180 75Q210 60 240 75L245 160L175 160Z" class="skin"/><path d="M190 85L145 45M230 85L275 45M175 160L150 255M245 160L270 255" class="outline"/><circle cx="140" cy="40" r="11" class="weight"/><circle cx="280" cy="40" r="11" class="weight"/><path d="M145 55Q130 100 145 130M275 55Q290 100 275 130" class="arrow"/><path d="M178 78Q210 60 242 78" class="muscle pulse"/>';
else if(type==='curl') b='<circle cx="210" cy="48" r="23" class="skin"/><path d="M180 75Q210 62 240 75L245 160L175 160Z" class="skin"/><path d="M190 85L145 125L130 170M230 85L275 125L290 170" class="skin"/><path d="M175 160L150 255M245 160L270 255" class="outline"/><circle cx="130" cy="180" r="12" class="weight"/><circle cx="290" cy="180" r="12" class="weight"/><path d="M130 180Q105 130 145 100M290 180Q315 130 275 100" class="arrow"/><path d="M150 125L135 170L165 180L190 130M270 125L285 170L255 180L230 130" class="muscle pulse"/>';
else if(type==='tri') b='<circle cx="210" cy="48" r="23" class="skin"/><path d="M180 75Q210 62 240 75L245 160L175 160Z" class="skin"/><path d="M190 90L150 130L170 165M230 90L270 130L250 165" class="outline"/><path d="M175 160L150 255M245 160L270 255" class="outline"/><circle cx="170" cy="165" r="11" class="weight"/><circle cx="250" cy="165" r="11" class="weight"/><path d="M170 165Q140 120 155 90M250 165Q280 120 265 90" class="arrow"/><path d="M150 130L170 165L185 125M270 130L250 165L235 125" class="muscle pulse"/>';
else if(type==='hip') b='<circle cx="265" cy="135" r="21" class="skin"/><path d="M245 155L190 170L115 190L75 235M190 170L230 220L275 240" class="skin"/><path d="M115 190L75 235M230 220L275 240" class="outline"/><circle cx="190" cy="165" r="12" class="weight"/><path d="M110 130Q160 105 215 135Q250 155 275 190" class="arrow"/><path d="M175 165L220 165L245 190L210 215L160 195Z" class="muscle pulse"/>';
else if(type==='lat') b='<circle cx="210" cy="48" r="23" class="skin"/><path d="M180 75Q210 62 240 75L245 160L175 160Z" class="skin"/><path d="M190 85L135 135M230 85L285 135M175 160L150 255M245 160L270 255" class="outline"/><circle cx="130" cy="140" r="11" class="weight"/><circle cx="290" cy="140" r="11" class="weight"/><path d="M135 140Q150 90 175 70M285 140Q270 90 245 70" class="arrow"/><path d="M178 78Q210 60 242 78L232 110L210 120L188 110Z" class="muscle pulse"/>';
else b='<circle cx="210" cy="55" r="22" class="skin"/><path d="M190 82L150 135L105 185L70 205M175 145L230 160L285 190L335 195" class="skin"/><path d="M190 95L235 95L235 145L190 145Z" class="muscle pulse"/><path d="M120 120Q160 90 205 100" class="arrow"/>';
return `<svg viewBox="0 0 420 300">${b}<text x="16" y="285" font-size="13" fill="#555">🔴 główne mięśnie • strzałki = kierunek ruchu</text></svg>`;
}
function save(){localStorage.setItem('fitplan',JSON.stringify(state))}
function progress(){let max=W[tab].reduce((s,e)=>s+e[1],0),d=W[tab].reduce((s,e,j)=>s+Math.min(state.done[tab+j]||0,e[1]),0);return Math.round(d/max*100)}
function render(){
let e=W[tab][idx],k=tab+idx,c=state.done[k]||0;
let rows='';for(let n=0;n<e[1];n++)rows+=`<div class="set"><span>Seria ${n+1} <span class="muted">• ${e[2]}</span></span><button class="check ${c>n?'done':''}" data-set="${n}">${c>n?'✓':'○'}</button></div>`;
app.innerHTML=`<div class="muted small">${e[3]} • ćwiczenie ${idx+1}/${W[tab].length}</div><div class="row"><div><h2 style="margin:4px 0">${e[0]}</h2><div class="muted small">${e[5]}</div></div><button id="next">Następne →</button></div><div class="hero">${fig(e[4])}</div><div class="card"><b>Serie</b>${rows}</div><div class="grid" style="margin-top:10px"><div class="metric"><div class="muted small">Ciężar</div><input id="weight" inputmode="decimal" placeholder="kg" value="${state.weight[k]||''}"></div><div class="metric"><div class="muted small">Przerwa</div><div class="big" id="timer">${fmt(sec)}</div></div><div class="metric"><div class="muted small">Postęp</div><div class="big">${Math.round(c/e[1]*100)}%</div></div></div><div class="actions"><button class="primary" id="rest">⏱️ Przerwa 90 s</button><button id="prev">← Wstecz</button><button id="finish">Zakończ</button></div>`;
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{let n=+b.dataset.set,old=state.done[k]||0;state.done[k]=n<old?n:(n===old?old+1:old);save();render()});
document.getElementById('next').onclick=()=>{if(idx<W[tab].length-1){idx++;render()}else finish()};
document.getElementById('prev').onclick=()=>{if(idx){idx--;render()}};
document.getElementById('weight').onchange=x=>{state.weight[k]=x.target.value;save()};
document.getElementById('rest').onclick=startTimer;
document.getElementById('finish').onclick=finish;
document.getElementById('pct').textContent=progress()+'%';
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTimer(){clearInterval(timer);sec=90;let el=document.getElementById('timer');timer=setInterval(()=>{sec--;if(el)el.textContent=fmt(sec);if(sec<=0){clearInterval(timer);if(el)el.textContent='00:00';}},1000)}
function finish(){clearInterval(timer);state.sessions.push({date:new Date().toISOString(),workout:tab});save();app.innerHTML=`<div class="card" style="text-align:center;padding:30px"><div style="font-size:54px">🔥</div><h2>Trening ukończony!</h2><p class="muted">Świetna robota. Wyniki zostały zapisane na tym urządzeniu.</p><button class="primary" id="back">Wróć do treningu</button></div>`;document.getElementById('back').onclick=()=>{idx=0;render()}}
function plan(){app.innerHTML=`<div class="list"><div class="card"><h2 style="margin-top:0">Plan 8 tygodni</h2><p class="muted">2 dni: A + B. 3 dni: A + B + A, a kolejny tydzień B + A + B.</p></div><div class="card"><b>Tygodnie 1–2</b><p class="muted">Technika, dobór ciężaru, 2–3 powtórzenia w zapasie.</p></div><div class="card"><b>Tygodnie 3–4</b><p class="muted">Dochodź do górnego zakresu i zwiększaj ciężar małymi krokami.</p></div><div class="card"><b>Tygodnie 5–6</b><p class="muted">Większość serii kończ 1–2 powtórzenia przed upadkiem.</p></div><div class="card"><b>Tygodnie 7–8</b><p class="muted">Utrzymuj siłę i technikę podczas redukcji.</p></div></div>`}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;idx=0;if(tab==='plan')plan();else render()});
render();
</script>
</body>
</html>
